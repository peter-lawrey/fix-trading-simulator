<mat-card>
    <mat-card-title>
        {{title}}
    </mat-card-title>
    <button mat-raised-button (click)="readMessages(true)" color="primary">
        Refresh
    </button>
    <button mat-stroked-button class="latest" (click)="latest()" [disabled]="latestPage">
        Latest
    </button>
    <button mat-stroked-button class="newer" (click)="newer()" [disabled]="latestPage">
        Newer
    </button>
    <button mat-stroked-button class="older" (click)="older()" [disabled]="!logMessages.length || logMessages[logMessages.length - 1].id <= 1">
        Older
    </button>
    <span class="page-range" [attr.data-latest]="latestPage">Messages {{ range }}<span *ngIf="latestPage"> (newest)</span></span>

    <div class="mat-elevation-z4">
        <table mat-table [dataSource]="logMessages" [trackBy]="trackById">
            <!-- ID Column -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>Id</th>
                <td mat-cell *matCellDef="let row">{{row.id}}</td>
            </ng-container>

            <!-- Time Column -->
            <ng-container matColumnDef="time">
                <th mat-header-cell *matHeaderCellDef>Time</th>
                <td mat-cell *matCellDef="let row">{{row.time}}</td>
            </ng-container>

            <!-- Text Column -->
            <ng-container matColumnDef="text">
                <th mat-header-cell *matHeaderCellDef>Text</th>
                <td mat-cell *matCellDef="let row">{{row.text}}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>

</mat-card>
