services:
  exchange-back-end:
    build:
      context: exchange-back-end
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      JDK_JAVA_OPTIONS: "@/app/queue-jvm.args"
      SIM_BUSINESS_JOURNAL: ${SIM_BUSINESS_JOURNAL:-auto}
      SIM_STORE: /store
      SIM_FIX_HOST: 0.0.0.0
    volumes:
      - exchange-store:/store
      - ./queue-jvm.args:/app/queue-jvm.args:ro

  broker-back-end:
    build:
      context: broker-back-end
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JDK_JAVA_OPTIONS: "@/app/queue-jvm.args"
      SIM_BUSINESS_JOURNAL: ${SIM_BUSINESS_JOURNAL:-auto}
      SIM_STORE: /store
      SIM_FIX_HOST: exchange-back-end
    volumes:
      - broker-store:/store
      - ./queue-jvm.args:/app/queue-jvm.args:ro

  postgresql-qfj:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a password for the local reporting database}
    volumes:
      - reporting-db:/var/lib/postgresql/data
      - ./init-broker.sql:/docker-entrypoint-initdb.d/01-broker.sql:ro
      - ./init-exchange.sql:/docker-entrypoint-initdb.d/02-exchange.sql:ro

  reporting-gateway:
    build: reporting-gateway
    environment:
      JDK_JAVA_OPTIONS: "@/app/queue-jvm.args"
      SIM_DB_URL: jdbc:postgresql://postgresql-qfj:5432/postgres?reWriteBatchedInserts=true
      SIM_DB_USER: postgres
      SIM_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - broker=/broker/business-queue
      - exchange=/exchange/business-queue
    depends_on:
      postgresql-qfj:
        condition: service_healthy
    volumes:
      - ./queue-jvm.args:/app/queue-jvm.args:ro
      - broker-store:/broker:ro
      - exchange-store:/exchange:ro

  exchange-front-end:
    build: exchange-front-end
    ports:
      - "127.0.0.1:90:80"
  broker-front-end:
    build: broker-front-end
    ports:
      - "127.0.0.1:80:80"

volumes:
  broker-store:
  exchange-store:
  reporting-db:
